<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Fotocamera Lesioni Cutanee - NVS WardPad</title>

    <style>
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --brand-primary: #0f766e;
            --brand-secondary: #0284c7; 
            --success: #059669;
            --alert-red: #e11d48;
            --radius-md: 10px;
            --radius-lg: 14px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-body); margin: 0; padding: 0; color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        .app-header { background: #ffffff; color: var(--text-main); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); box-shadow: var(--shadow-sm); z-index: 10; flex-shrink: 0; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .back-btn { background: none; border: none; font-size: 1.15rem; color: var(--brand-primary); font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 0; }
        .patient-title { font-size: 1.1rem; font-weight: 800; text-transform: uppercase; color: var(--text-main); border-left: 2px solid var(--border); padding-left: 12px; }

        .main-container { flex: 1; overflow-y: auto; padding: 20px; -webkit-overflow-scrolling: touch; display: flex; justify-content: center; }
        .content-wrapper { width: 100%; max-width: 1000px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding-bottom: 50px; }
        @media (max-width: 860px) { .content-wrapper { grid-template-columns: 1fr; } }

        .card-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 14px; }
        .card-title { margin: 0; font-size: 1.05rem; font-weight: 800; color: var(--brand-primary); border-bottom: 1px solid var(--border); padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; text-transform: uppercase; }

        /* AREA FOTOCAMERA / ANTEPRIMA */
        .camera-dropzone { border: 2px dashed var(--brand-secondary); border-radius: var(--radius-md); background: #f0f9ff; min-height: 280px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; cursor: pointer; }
        .camera-dropzone img { width: 100%; height: 100%; object-fit: contain; position: absolute; top: 0; left: 0; }
        .camera-prompt { text-align: center; color: var(--brand-secondary); padding: 20px; pointer-events: none; }
        .camera-prompt svg { width: 52px; height: 52px; margin-bottom: 8px; stroke: var(--brand-secondary); fill: none; stroke-width: 1.8; }
        
        .file-hidden-input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 5; }

        /* FORM CONTROLS */
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        .touch-input { background: #f8fafc; border: 1.5px solid var(--border); border-radius: var(--radius-md); padding: 11px 12px; font-size: 0.95rem; font-weight: 600; color: var(--text-main); outline: none; }
        .touch-input:focus { border-color: var(--brand-primary); background: #ffffff; }

        /* GALLERIA STORICO */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; max-height: 380px; overflow-y: auto; padding: 4px; }
        .gallery-thumb { border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; background: #fff; box-shadow: var(--shadow-sm); cursor: pointer; transition: transform 0.15s; }
        .gallery-thumb:active { transform: scale(0.96); }
        .gallery-thumb img { width: 100%; height: 95px; object-fit: cover; display: block; }
        .gallery-meta { padding: 6px; font-size: 0.75rem; color: var(--text-muted); line-height: 1.2; }
        .gallery-meta strong { color: var(--text-main); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* FOOTER ACTIONS */
        .bottom-action-bar { position: sticky; bottom: 0; background: #ffffff; padding: 14px 20px; border-top: 1px solid var(--border); box-shadow: 0 -4px 10px rgba(0,0,0,0.04); display: flex; justify-content: center; z-index: 20; }
        .btn-upload { background: var(--brand-primary); color: #fff; border: none; padding: 16px 28px; border-radius: var(--radius-lg); font-size: 1.15rem; font-weight: 700; width: 100%; max-width: 1000px; cursor: pointer; box-shadow: 0 4px 6px rgba(15, 118, 110, 0.2); display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-upload:active { transform: scale(0.98); }
        .btn-upload:disabled { opacity: 0.5; pointer-events: none; }

        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 50000; }
        .toast { background: #1e293b; color: #fff; padding: 14px 24px; border-radius: 30px; font-size: 0.95rem; font-weight: 600; opacity: 0; transition: opacity 0.3s; box-shadow: var(--shadow-md); text-align: center; }
        .toast.show { opacity: 1; }
        
        .svg-icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>

    <!-- FIREBASE COMPAT SDK: APP + FIRESTORE + STORAGE -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
</head>
<body>
    <div id="toast-container"></div>

    <header class="app-header">
        <div class="header-left">
            <button class="back-btn" onclick="window.location.href='tablet_hub.html'">
                <svg class="svg-icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg> Reparto
            </button>
            <div class="patient-title" id="headerPatientName">Caricamento...</div>
        </div>
        <div style="font-size:0.85rem; font-weight:700; color:var(--brand-primary); background:#f0fdfa; padding:6px 14px; border-radius:20px; border:1px solid #ccfbf1;">
            Monitoraggio Fotografico
        </div>
    </header>

    <main class="main-container">
        <div class="content-wrapper">

            <!-- ACQUISIZIONE FOTO -->
            <div class="card-box">
                <h3 class="card-title">📷 Scatto & Rilievo Lesione</h3>

                <!-- Tocco per aprire direttamente la fotocamera posteriore -->
                <div class="camera-dropzone" id="cameraZone">
                    <input type="file" id="cameraFileInput" class="file-hidden-input" accept="image/*" capture="environment" onchange="window.handleImageCapture(event)">
                    <img id="previewImg" style="display:none;" alt="Anteprima lesione">
                    <div class="camera-prompt" id="cameraPrompt">
                        <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                        <div style="font-weight:800; font-size:1.1rem; margin-bottom:4px;">Tocca per Scattare Foto</div>
                        <div style="font-size:0.82rem; color:var(--text-muted);">Attiva la fotocamera del tablet al letto del paziente</div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Sede Anatomica della Lesione</label>
                    <select id="fotoSede" class="touch-input">
                        <option value="Zona Sacrale / Coccige">Zona Sacrale / Coccige</option>
                        <option value="Tallone Destro">Tallone Destro</option>
                        <option value="Tallone Sinistro">Tallone Sinistro</option>
                        <option value="Trocantere Destro">Trocantere Destro</option>
                        <option value="Trocantere Sinistro">Trocantere Sinistro</option>
                        <option value="Gomito / Arto Superiore">Gomito / Arto Superiore</option>
                        <option value="Malleolo">Malleolo</option>
                        <option value="Altra Sede">Altra Sede (Specificare nelle note)</option>
                    </select>
                </div>

                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                    <div class="form-group">
                        <label>Stadio / Grado</label>
                        <select id="fotoStadio" class="touch-input">
                            <option value="Iperemia (Non sbiancabile)">Iperemia (Non sbiancabile)</option>
                            <option value="Stadio I">Stadio I</option>
                            <option value="Stadio II (Fittene / Erosione)">Stadio II (Fittene / Erosione)</option>
                            <option value="Stadio III (Tessuto sottocutaneo)">Stadio III (Tessuto sottocutaneo)</option>
                            <option value="Stadio IV (Coinvolgimento osseo)">Stadio IV (Coinvolgimento osseo)</option>
                            <option value="Non Stadiabile / Escara">Non Stadiabile / Escara</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Dimensioni Rilevate</label>
                        <input type="text" id="fotoDimensioni" class="touch-input" placeholder="Es. 2x3 cm">
                    </div>
                </div>

                <div class="form-group">
                    <label>Tipo Medicazione / Note Evolutive</label>
                    <textarea id="fotoNote" class="touch-input" rows="2" placeholder="Es. Detersione con fisiologica, applicazione idrogel e idrocolloide..."></textarea>
                </div>
            </div>

            <!-- STORICO CRONOLOGICO LESIONI -->
            <div class="card-box">
                <h3 class="card-title">
                    <span>🗂️ Storico Evolutivo Paziente</span>
                    <span id="fotoCountBadge" style="font-size:0.75rem; color:var(--text-muted); font-weight:700;">0 Foto</span>
                </h3>

                <div class="gallery-grid" id="galleryContainer">
                    <div style="grid-column: 1/-1; text-align:center; padding:30px; color:var(--text-muted); font-size:0.85rem;">
                        Caricamento rilievi fotografici...
                    </div>
                </div>
            </div>

        </div>
    </main>

    <div class="bottom-action-bar">
        <button class="btn-upload" id="btnSalvaFoto" onclick="window.salvaFotoSuStorage()">
            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            Archivia Foto & Aggiorna Diario Clinico
        </button>
    </div>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyAc0fIlfds4Gne5m3qpH25uacK4NeR6TzM", 
            authDomain: "gestione-visite-b445b.firebaseapp.com", 
            projectId: "gestione-visite-b445b", 
            storageBucket: "gestione-visite-b445b.firebasestorage.app", 
            messagingSenderId: "720937824810", 
            appId: "1:720937824810:web:b04b60d1d66bb8f4040953" 
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const storage = firebase.storage();

        window.activeOperator = sessionStorage.getItem("activeOperator") || localStorage.getItem("activeOperator") || "Operatore";

        const urlParams = new URLSearchParams(window.location.search);
        window.targetPatient = (urlParams.get('ospite') || sessionStorage.getItem('globalSelectedPatient') || "").trim().toUpperCase();

        if(!window.targetPatient) {
            window.location.href = 'tablet_hub.html';
        } else {
            document.getElementById('headerPatientName').innerText = window.targetPatient;
        }

        window.selectedBlob = null;

        window.showToast = (m) => {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = 'toast'; t.innerText = m;
            c.appendChild(t);
            setTimeout(() => t.classList.add('show'), 10);
            setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 2200);
        };

        // GESTIONE SCATTO E COMPRESSIONE CLIENT-SIDE
        window.handleImageCapture = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            window.showToast("Elaborazione immagine...");
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    // Ridimensionamento per ottimizzare upload e banda su tablet
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1280;
                    const MAX_HEIGHT = 1280;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    canvas.toBlob((blob) => {
                        window.selectedBlob = blob;
                        const preview = document.getElementById('previewImg');
                        preview.src = URL.createObjectURL(blob);
                        preview.style.display = 'block';
                        document.getElementById('cameraPrompt').style.display = 'none';
                        window.showToast("Foto pronta per l'archiviazione!");
                    }, 'image/jpeg', 0.82);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        };

        // UPLOAD SU FIREBASE STORAGE & ARCHIVIAZIONE
        window.salvaFotoSuStorage = async () => {
            if (!window.selectedBlob) {
                return window.showToast("⚠️ Scatta o seleziona prima una fotografia.");
            }

            const sedeVal = document.getElementById('fotoSede').value;
            const stadioVal = document.getElementById('fotoStadio').value;
            const dimVal = document.getElementById('fotoDimensioni').value.trim();
            const noteVal = document.getElementById('fotoNote').value.trim();
            const btn = document.getElementById('btnSalvaFoto');

            try {
                btn.disabled = true;
                btn.innerText = "⏳ Caricamento su Firebase Storage...";
                window.showToast("Upload in corso su Cloud Storage...");

                const timestamp = Date.now();
                const storagePath = `lesioni/${window.targetPatient}/${timestamp}_lesione.jpg`;
                const storageRef = storage.ref().child(storagePath);

                // 1. Upload file binario su Storage
                const uploadTask = await storageRef.put(window.selectedBlob, {
                    contentType: 'image/jpeg',
                    customMetadata: {
                        paziente: window.targetPatient,
                        operatore: window.activeOperator,
                        sede: sedeVal
                    }
                });

                const downloadUrl = await uploadTask.ref.getDownloadURL();

                const now = new Date();
                const dataStr = `${now.toLocaleDateString('it-IT')} ore ${now.toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'})}`;

                // 2. Registrazione del record nella collezione 'foto_lesioni'
                await db.collection("foto_lesioni").add({
                    ospite: window.targetPatient,
                    url: downloadUrl,
                    storagePath: storagePath,
                    sede: sedeVal,
                    stadio: stadioVal,
                    dimensioni: dimVal || 'Non specificate',
                    note: noteVal,
                    op: window.activeOperator,
                    data: dataStr,
                    ts: timestamp
                });

                // 3. Notifica automatica nel Diario Clinico
                await db.collection("diario_clinico").add({
                    data: dataStr,
                    ospite: window.targetPatient,
                    tipo: 'Clinica',
                    nota: `Rilievo Fotografico Lesione ➔ Sede: ${sedeVal} | ${stadioVal}${dimVal ? ' ('+dimVal+')' : ''}${noteVal ? ' | Note: ' + noteVal : ''}`,
                    fotoUrl: downloadUrl,
                    op: window.activeOperator,
                    ts: timestamp
                });

                window.showToast("✅ Fotografia archiviata con successo!");

                // Reset modulo
                window.selectedBlob = null;
                document.getElementById('previewImg').style.display = 'none';
                document.getElementById('cameraPrompt').style.display = 'block';
                document.getElementById('fotoDimensioni').value = '';
                document.getElementById('fotoNote').value = '';

            } catch (err) {
                console.error("Errore upload Storage:", err);
                window.showToast("❌ Errore durante l'upload: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<svg class="svg-icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg> Archivia Foto & Aggiorna Diario Clinico`;
            }
        };

        // GALLERIA STORICO IN TEMPO REALE
        const ascoltaFotoStorico = () => {
            db.collection("foto_lesioni")
              .where("ospite", "==", window.targetPatient)
              .onSnapshot(snap => {
                  const gallery = document.getElementById('galleryContainer');
                  gallery.innerHTML = '';
                  document.getElementById('fotoCountBadge').innerText = `${snap.size} Foto`;

                  if (snap.empty) {
                      gallery.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:30px; color:var(--text-muted); font-size:0.85rem;">Nessuna foto lesione archiviata per questo ospite.</div>`;
                      return;
                  }

                  let items = [];
                  snap.forEach(d => items.push({ id: d.id, ...d.data() }));
                  items.sort((a,b) => (b.ts || 0) - (a.ts || 0));

                  items.forEach(item => {
                      gallery.innerHTML += `
                          <div class="gallery-thumb" onclick="window.open('${item.url}', '_blank')">
                              <img src="${item.url}" alt="${item.sede}">
                              <div class="gallery-meta">
                                  <strong>${item.sede}</strong>
                                  <div>${item.stadio}</div>
                                  <div style="font-size:0.7rem; color:var(--text-muted);">${item.data}</div>
                              </div>
                          </div>
                      `;
                  });
              });
        };

        ascoltaFotoStorico();
    </script>
</body>
</html>

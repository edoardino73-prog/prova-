<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Diario Clinico di Reparto - NVS WardPad</title>

    <style>
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --brand-med: #0284c7;     /* Azzurro Medico */
            --brand-inf: #0f766e;     /* Verde Ottanio Infermiere */
            --success: #059669;
            --alert-red: #e11d48;
            --radius-md: 10px;
            --radius-lg: 14px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-body); margin: 0; padding: 0; color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        .app-header { background: #ffffff; color: var(--text-main); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); box-shadow: var(--shadow-sm); z-index: 10; flex-shrink: 0; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .back-btn { background: none; border: none; font-size: 1.15rem; color: var(--brand-inf); font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 0; }
        .patient-title { font-size: 1.1rem; font-weight: 800; text-transform: uppercase; color: var(--text-main); border-left: 2px solid var(--border); padding-left: 12px; }

        .main-container { flex: 1; overflow-y: auto; padding: 18px 20px; -webkit-overflow-scrolling: touch; display: flex; justify-content: center; }
        .content-wrapper { width: 100%; max-width: 1100px; display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 20px; padding-bottom: 50px; }
        @media (max-width: 920px) { .content-wrapper { grid-template-columns: 1fr; } }

        .card-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 16px; }
        .card-title { margin: 0; font-size: 1.05rem; font-weight: 800; color: var(--text-main); border-bottom: 1px solid var(--border); padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; text-transform: uppercase; letter-spacing: 0.5px; }

        /* SELETTORE REGISTRO CON BLOCCO RUOLI */
        .register-switch { display: flex; gap: 8px; background: #f1f5f9; padding: 4px; border-radius: var(--radius-md); }
        .btn-switch { flex: 1; padding: 10px 8px; border: none; border-radius: 8px; font-weight: 800; font-size: 0.88rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--text-muted); transition: all 0.15s; }
        .btn-switch.active-inf { background: #ffffff; color: var(--brand-inf); box-shadow: var(--shadow-sm); }
        .btn-switch.active-med { background: #ffffff; color: var(--brand-med); box-shadow: var(--shadow-sm); }
        .btn-switch.locked { opacity: 0.45; cursor: not-allowed; text-decoration: line-through; }

        .role-notice { font-size: 0.82rem; font-weight: 700; padding: 8px 12px; border-radius: 6px; display: flex; align-items: center; justify-content: space-between; }
        .role-notice.inf { background: #f0fdfa; color: var(--brand-inf); border: 1px solid #ccfbf1; }
        .role-notice.med { background: #e0f2fe; color: var(--brand-med); border: 1px solid #bae6fd; }

        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        .touch-input { background: #f8fafc; border: 1.5px solid var(--border); border-radius: var(--radius-md); padding: 12px; font-size: 0.95rem; font-weight: 600; color: var(--text-main); outline: none; font-family: inherit; }
        .touch-input:focus { border-color: var(--brand-inf); background: #ffffff; }

        /* AREA CANVAS PER LA FIRMA */
        .signature-box { border: 1.5px dashed var(--border); border-radius: var(--radius-md); background: #fcfcfc; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
        .sig-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; font-weight: 700; color: var(--text-muted); }
        .canvas-wrap { position: relative; width: 100%; height: 110px; background: #ffffff; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
        canvas { width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
        .btn-clear-sig { background: #fee2e2; color: var(--alert-red); border: none; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; cursor: pointer; }

        /* TIMELINE DIARIO */
        .filter-bar { display: flex; gap: 6px; margin-bottom: 8px; }
        .btn-filter { flex: 1; padding: 7px; background: #f8fafc; border: 1px solid var(--border); border-radius: 6px; font-size: 0.78rem; font-weight: 700; color: var(--text-muted); cursor: pointer; text-align: center; }
        .btn-filter.active { background: #0f172a; color: #fff; border-color: #0f172a; }

        .timeline-scroll { display: flex; flex-direction: column; gap: 12px; max-height: 520px; overflow-y: auto; padding-right: 4px; }
        .timeline-item { background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px; display: flex; flex-direction: column; gap: 6px; }
        .timeline-item.med { border-left: 5px solid var(--brand-med); }
        .timeline-item.inf { border-left: 5px solid var(--brand-inf); }
        
        .entry-top { display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; font-weight: 700; color: var(--text-muted); }
        .entry-badge { padding: 3px 8px; border-radius: 6px; font-size: 0.72rem; font-weight: 800; text-transform: uppercase; }
        .entry-badge.med { background: #e0f2fe; color: var(--brand-med); }
        .entry-badge.inf { background: #f0fdfa; color: var(--brand-inf); }
        
        .entry-text { font-size: 0.92rem; color: var(--text-main); line-height: 1.45; white-space: pre-wrap; font-weight: 500; }
        .entry-signature-img { max-height: 40px; width: auto; object-fit: contain; align-self: flex-end; margin-top: 4px; border-bottom: 1px solid var(--border); }

        /* FOOTER ACTIONS */
        .bottom-action-bar { position: sticky; bottom: 0; background: #ffffff; padding: 14px 20px; border-top: 1px solid var(--border); box-shadow: 0 -4px 10px rgba(0,0,0,0.04); display: flex; justify-content: center; z-index: 20; }
        .btn-submit-entry { background: var(--brand-inf); color: #fff; border: none; padding: 16px 28px; border-radius: var(--radius-lg); font-size: 1.15rem; font-weight: 700; width: 100%; max-width: 1100px; cursor: pointer; box-shadow: 0 4px 6px rgba(15, 118, 110, 0.2); display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-submit-entry:active { transform: scale(0.98); }

        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 50000; }
        .toast { background: #1e293b; color: #fff; padding: 14px 24px; border-radius: 30px; font-size: 0.95rem; font-weight: 600; opacity: 0; transition: opacity 0.3s; box-shadow: var(--shadow-md); text-align: center; }
        .toast.show { opacity: 1; }
        
        .svg-icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>

    <!-- FIREBASE COMPAT SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div id="toast-container"></div>

    <header class="app-header">
        <div class="header-left">
            <button class="back-btn" onclick="window.location.href='tablet_hub.html'">
                <svg class="svg-icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg> Reparto
            </button>
            <div class="patient-title" id="headerPatientName">Caricamento...</div>
        </div>
        <div id="roleHeaderBadge" style="font-size:0.85rem; font-weight:800; padding:6px 14px; border-radius:20px;">-</div>
    </header>

    <main class="main-container">
        <div class="content-wrapper">

            <!-- 1. FORM REDAZIONE NOTA CLINICA PROTETTA DA RUOLO -->
            <div class="card-box">
                <h3 class="card-title">
                    <span>✍️ Registrazione Clinica</span>
                    <small id="lblAccessLevel" style="font-size:0.75rem; text-transform:none;"></small>
                </h3>

                <!-- Switch Ruolo protetto -->
                <div class="register-switch">
                    <button type="button" class="btn-switch" id="btnSwitchInf" onclick="window.selezionaRegistro('Infermieristico')">
                        🩺 Diario Infermieristico
                    </button>
                    <button type="button" class="btn-switch" id="btnSwitchMed" onclick="window.selezionaRegistro('Medico')">
                        👨‍⚕️ Diario Medico
                    </button>
                </div>

                <div class="role-notice" id="roleNoticeBox">
                    <span id="roleNoticeText">Verifica credenziali operatore...</span>
                    <strong id="badgeOperatore">-</strong>
                </div>

                <div class="form-group">
                    <label>Oggetto / Motivo</label>
                    <input type="text" id="entryTitle" class="touch-input" placeholder="Es. Valutazione clinica, medicazione, febbre, variazione terapia...">
                </div>

                <div class="form-group">
                    <label>Relazione Clinica / Obiettività</label>
                    <textarea id="entryBody" class="touch-input" rows="5" placeholder="Descrizione dell'esame obiettivo, sintomi, provvedimenti adottati, prescrizioni..."></textarea>
                </div>

                <!-- Box Firma Grafometrica Digitale -->
                <div class="signature-box">
                    <div class="sig-header">
                        <span>Firma e Timbro (<strong id="lblSignerName">Operatore</strong>)</span>
                        <button type="button" class="btn-clear-sig" onclick="window.clearSignature()">Pulisci Firma</button>
                    </div>
                    <div class="canvas-wrap">
                        <canvas id="signaturePad"></canvas>
                    </div>
                </div>
            </div>

            <!-- 2. TIMELINE STORICA CONSULTABILE -->
            <div class="card-box">
                <h3 class="card-title">
                    <span>📑 Fascicolo Storico Paziente</span>
                    <span id="entriesCount" style="font-size:0.75rem; color:var(--text-muted); font-weight:700;">0 note</span>
                </h3>

                <div class="filter-bar">
                    <div class="btn-filter active" onclick="window.filterTimeline('ALL', this)">Tutti i Diari</div>
                    <div class="btn-filter" onclick="window.filterTimeline('Medico', this)">👨‍⚕️ Registro Medico</div>
                    <div class="btn-filter" onclick="window.filterTimeline('Infermieristico', this)">🩺 Registro Infermiere</div>
                </div>

                <div class="timeline-scroll" id="timelineContainer">
                    <div style="text-align:center; padding:35px; color:var(--text-muted); font-size:0.85rem;">
                        Caricamento diario clinico...
                    </div>
                </div>
            </div>

        </div>
    </main>

    <div class="bottom-action-bar">
        <button class="btn-submit-entry" id="btnSalvaEntry" onclick="window.salvaNotaClinica()">
            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
            Firma & Salva Registrazione
        </button>
    </div>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyAc0fIlfds4Gne5m3qpH25uacK4NeR6TzM", 
            authDomain: "gestione-visite-b445b.firebaseapp.com", 
            projectId: "gestione-visite-b445b", 
            storageBucket: "gestione-visite-b445b.firebasestorage.app", 
            messagingSenderId: "720937824810", 
            appId: "1:720937824810:web:b04b60d1d66bb8f4040953" 
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        window.activeOperator = sessionStorage.getItem("activeOperator") || localStorage.getItem("activeOperator") || "Operatore";
        window.activeQualifica = (sessionStorage.getItem("activeQualifica") || localStorage.getItem("activeQualifica") || "Infermiere").trim();

        const urlParams = new URLSearchParams(window.location.search);
        window.targetPatient = (urlParams.get('ospite') || sessionStorage.getItem('globalSelectedPatient') || "").trim().toUpperCase();

        if(!window.targetPatient) {
            window.location.href = 'tablet_hub.html';
        } else {
            document.getElementById('headerPatientName').innerText = window.targetPatient;
        }

        window.isMedico = window.activeQualifica.toLowerCase().includes('medico') || window.activeQualifica.toLowerCase().includes('sanitario') || window.activeQualifica.toLowerCase().includes('direttore');
        window.isInfermiere = window.activeQualifica.toLowerCase().includes('infermiere') || window.activeQualifica.toLowerCase().includes('inf');

        // Determinazione del registro assegnato
        window.currentRegisterType = window.isMedico ? 'Medico' : 'Infermieristico';

        window.showToast = (m) => {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = 'toast'; t.innerText = m;
            c.appendChild(t);
            setTimeout(() => t.classList.add('show'), 10);
            setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 2200);
        };

        // APPLICAZIONE CONTROLLO ACCESSI SUI TAB
        window.applicaPermessiRuolo = () => {
            const btnInf = document.getElementById('btnSwitchInf');
            const btnMed = document.getElementById('btnSwitchMed');
            const noticeBox = document.getElementById('roleNoticeBox');
            const noticeTxt = document.getElementById('roleNoticeText');
            const badgeOp = document.getElementById('badgeOperatore');
            const roleHeaderBadge = document.getElementById('roleHeaderBadge');
            const btnSalva = document.getElementById('btnSalvaEntry');

            badgeOp.innerText = `${window.activeOperator} (${window.activeQualifica})`;
            document.getElementById('lblSignerName').innerText = `${window.activeOperator} [${window.activeQualifica}]`;

            if (window.isMedico) {
                // MEDICO / DIRETTORE SANITARIO
                btnMed.className = 'btn-switch active-med';
                btnInf.className = 'btn-switch'; // Il medico può redigere su entrambi o vidimare
                noticeBox.className = 'role-notice med';
                noticeTxt.innerText = "Accesso Medico / Direzione Sanitaria abilitato alla compilazione clinica";
                roleHeaderBadge.innerText = "Profilo: Medico";
                roleHeaderBadge.style.background = "#e0f2fe";
                roleHeaderBadge.style.color = "var(--brand-med)";
                btnSalva.style.background = "var(--brand-med)";
                btnSalva.style.boxShadow = "0 4px 6px rgba(2, 132, 199, 0.2)";
            } else if (window.isInfermiere) {
                // INFERMIERE: Diario Medico BLOCCATO
                btnInf.className = 'btn-switch active-inf';
                btnMed.className = 'btn-switch locked';
                btnMed.title = "Accesso riservato a Medico e Direttore Sanitario";
                noticeBox.className = 'role-notice inf';
                noticeTxt.innerText = "Profilo Infermieristico: Redazione abilitata su Diario Infermiere";
                roleHeaderBadge.innerText = "Profilo: Infermiere";
                roleHeaderBadge.style.background = "#f0fdfa";
                roleHeaderBadge.style.color = "var(--brand-inf)";
                btnSalva.style.background = "var(--brand-inf)";
                btnSalva.style.boxShadow = "0 4px 6px rgba(15, 118, 110, 0.2)";
            } else {
                // OSS / ALTRI RUOLI
                btnInf.className = 'btn-switch locked';
                btnMed.className = 'btn-switch locked';
                btnSalva.disabled = true;
                btnSalva.innerText = "🔒 Consultazione in sola lettura (Usa Diario OSS per le consegne)";
                btnSalva.style.opacity = "0.5";
                noticeBox.className = 'role-notice';
                noticeBox.style.background = "#fee2e2";
                noticeBox.style.color = "var(--alert-red)";
                noticeTxt.innerText = "Accesso redazione riservato esclusivamente a Medici e Infermieri.";
            }
        };

        // CAMBIO REGISTRO CON CONTROLLO DI SICUREZZA
        window.selezionaRegistro = (tipo) => {
            if (tipo === 'Medico' && !window.isMedico) {
                return window.showToast("⛔ Accesso negato: Il Diario Medico è riservato a Medici e Direttore Sanitario!");
            }
            if (tipo === 'Infermieristico' && !window.isInfermiere && !window.isMedico) {
                return window.showToast("⛔ Accesso riservato al personale infermieristico!");
            }

            window.currentRegisterType = tipo;
            const btnInf = document.getElementById('btnSwitchInf');
            const btnMed = document.getElementById('btnSwitchMed');
            const btnSalva = document.getElementById('btnSalvaEntry');

            if (tipo === 'Medico') {
                btnMed.className = 'btn-switch active-med';
                btnInf.className = 'btn-switch';
                btnSalva.style.background = 'var(--brand-med)';
                btnSalva.style.boxShadow = '0 4px 6px rgba(2, 132, 199, 0.2)';
            } else {
                btnInf.className = 'btn-switch active-inf';
                btnMed.className = window.isMedico ? 'btn-switch' : 'btn-switch locked';
                btnSalva.style.background = 'var(--brand-inf)';
                btnSalva.style.boxShadow = '0 4px 6px rgba(15, 118, 110, 0.2)';
            }
        };

        // GESTIONE CANVAS TOUCH PER FIRMA GRAFOMETRICA
        const canvas = document.getElementById('signaturePad');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let hasSigned = false;

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            ctx.strokeStyle = "#0f172a";
            ctx.lineWidth = 2.2;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
        }
        window.addEventListener('resize', resizeCanvas);
        setTimeout(resizeCanvas, 150);

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0].clientX);
            const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0].clientY);
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        canvas.addEventListener('mousedown', (e) => { isDrawing = true; hasSigned = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); });
        canvas.addEventListener('mousemove', (e) => { if (!isDrawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
        window.addEventListener('mouseup', () => { isDrawing = false; });

        canvas.addEventListener('touchstart', (e) => { isDrawing = true; hasSigned = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); }, { passive: false });
        canvas.addEventListener('touchmove', (e) => { if (!isDrawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); }, { passive: false });
        window.addEventListener('touchend', () => { isDrawing = false; });

        window.clearSignature = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            hasSigned = false;
        };

        // SALVATAGGIO CON VALIDAZIONE DI RUOLO
        window.salvaNotaClinica = async () => {
            if (window.currentRegisterType === 'Medico' && !window.isMedico) {
                return window.showToast("⛔ Permesso negato: solo i Medici possono firmare il Diario Medico.");
            }

            const titleVal = document.getElementById('entryTitle').value.trim();
            const bodyVal = document.getElementById('entryBody').value.trim();

            if (!bodyVal) {
                return window.showToast("⚠️ Inserisci la relazione clinica prima di firmare.");
            }

            const signatureDataUrl = hasSigned ? canvas.toDataURL('image/png') : null;
            const now = new Date();
            const timeStr = `${now.toLocaleDateString('it-IT')} ore ${now.toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'})}`;
            const logNota = `${titleVal ? '[' + titleVal + '] ' : ''}${bodyVal}`;

            try {
                window.showToast("⏳ Archiviazione e firma nel fascicolo...");

                await db.collection("diario_clinico").add({
                    ospite: window.targetPatient,
                    tipo: window.currentRegisterType, // 'Medico' o 'Infermieristico'
                    titolo: titleVal || 'Valutazione Clinica',
                    nota: logNota,
                    firmaUrl: signatureDataUrl,
                    op: window.activeOperator,
                    qualifica: window.activeQualifica,
                    data: timeStr,
                    ts: Date.now()
                });

                window.showToast(`✅ ${window.currentRegisterType === 'Medico' ? 'Diario Medico' : 'Diario Infermieristico'} registrato e firmato!`);

                document.getElementById('entryTitle').value = '';
                document.getElementById('entryBody').value = '';
                window.clearSignature();

            } catch (e) {
                console.error("Errore salvataggio diario:", e);
                window.showToast("❌ Errore durante il salvataggio.");
            }
        };

        // TIMELINE CRONOLOGICA FILTRABILE
        let allEntries = [];
        let currentFilter = 'ALL';

        window.filterTimeline = (filter, el) => {
            currentFilter = filter;
            document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            window.renderTimeline();
        };

        window.renderTimeline = () => {
            const container = document.getElementById('timelineContainer');
            container.innerHTML = '';

            let filtered = allEntries;
            if (currentFilter !== 'ALL') {
                filtered = allEntries.filter(e => e.tipo === currentFilter);
            }

            document.getElementById('entriesCount').innerText = `${filtered.length} note`;

            if (filtered.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:35px; color:var(--text-muted); font-size:0.85rem;">Nessuna registrazione clinica trovata per questo filtro.</div>`;
                return;
            }

            filtered.forEach(item => {
                const isMed = (item.tipo === 'Medico');
                container.innerHTML += `
                    <div class="timeline-item ${isMed ? 'med' : 'inf'}">
                        <div class="entry-top">
                            <span class="entry-badge ${isMed ? 'med' : 'inf'}">
                                ${isMed ? '👨‍⚕️ Diario Medico' : '🩺 Diario Infermiere'}
                            </span>
                            <span>${item.data}</span>
                        </div>
                        <div style="font-weight:700; font-size:0.95rem; color:var(--text-main); margin-top:2px;">
                            ${item.titolo || 'Valutazione Clinica'}
                        </div>
                        <div class="entry-text">${item.nota}</div>
                        <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-top:6px;">
                            <small style="color:var(--text-muted); font-weight:700;">
                                Redatto da: ${item.op || 'Operatore'} (${item.qualifica || 'Reparto'})
                            </small>
                            ${item.firmaUrl ? `<img src="${item.firmaUrl}" class="entry-signature-img" alt="Firma">` : ''}
                        </div>
                    </div>
                `;
            });
        };

        // CARICAMENTO IN TEMPO REALE DA FIRESTORE
        const caricaDiario = () => {
            db.collection("diario_clinico")
              .where("ospite", "==", window.targetPatient)
              .onSnapshot(snap => {
                  allEntries = [];
                  snap.forEach(d => {
                      const data = d.data();
                      if (data.tipo === 'Medico' || data.tipo === 'Infermieristico' || data.tipo === 'Clinica') {
                          allEntries.push({ id: d.id, ...data });
                      }
                  });
                  allEntries.sort((a,b) => (b.ts || 0) - (a.ts || 0));
                  window.renderTimeline();
              });
        };

        window.applicaPermessiRuolo();
        caricaDiario();
    </script>
</body>
</html>

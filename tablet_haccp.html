<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>HACCP & Sicurezza Cucina - NVS WardPad</title>

    <style>
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --haccp-primary: #15803d;   /* Verde Cucina/HACCP */
            --haccp-secondary: #0284c7;
            --alert-red: #e11d48;
            --alert-amber: #d97706;
            --radius-md: 10px;
            --radius-lg: 14px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-body); margin: 0; padding: 0; color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        .app-header { background: #ffffff; color: var(--text-main); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); box-shadow: var(--shadow-sm); z-index: 10; flex-shrink: 0; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .back-btn { background: none; border: none; font-size: 1.15rem; color: var(--haccp-primary); font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 0; }
        .header-title { font-size: 1.15rem; font-weight: 800; text-transform: uppercase; color: var(--text-main); border-left: 2px solid var(--border); padding-left: 12px; }

        /* TABS SEZIONI HACCP */
        .tab-bar { display: flex; background: #ffffff; border-bottom: 1px solid var(--border); padding: 0 20px; gap: 10px; flex-shrink: 0; overflow-x: auto; }
        .tab-btn { padding: 14px 18px; font-weight: 800; font-size: 0.9rem; border: none; background: transparent; color: var(--text-muted); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
        .tab-btn.active { color: var(--haccp-primary); border-bottom-color: var(--haccp-primary); }

        .main-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; justify-content: center; -webkit-overflow-scrolling: touch; }
        .content-wrapper { width: 100%; max-width: 950px; display: flex; flex-direction: column; gap: 18px; padding-bottom: 50px; }

        .card-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 22px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 16px; border-top: 5px solid var(--haccp-primary); }
        .card-title { margin: 0; font-size: 1.05rem; font-weight: 800; color: var(--haccp-primary); border-bottom: 1px solid var(--border); padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; text-transform: uppercase; }

        .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        @media (max-width: 768px) { .form-grid-2 { grid-template-columns: 1fr; } }

        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 0.8rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; }
        .touch-input { background: #f8fafc; border: 1.5px solid var(--border); border-radius: var(--radius-md); padding: 12px; font-size: 1rem; font-weight: 600; color: var(--text-main); outline: none; }
        .touch-input:focus { border-color: var(--haccp-primary); background: #ffffff; }

        /* CHECKBOX GRID GRANDI TOUCH */
        .check-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; background: #f8fafc; padding: 14px; border: 1px solid var(--border); border-radius: var(--radius-md); }
        .check-item { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 0.95rem; cursor: pointer; padding: 8px; border-radius: 6px; }
        .check-item input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--haccp-primary); }

        /* CAMERA BOX */
        .camera-box { border: 2px dashed var(--haccp-secondary); border-radius: var(--radius-md); background: #f0f9ff; min-height: 140px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; cursor: pointer; overflow: hidden; text-align: center; }
        .camera-box img { width: 100%; height: 180px; object-fit: contain; }
        .file-hidden-input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 5; }

        /* FIRMA CANVAS */
        .sig-container { border: 1.5px dashed var(--border); border-radius: var(--radius-md); background: #fcfcfc; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
        .sig-canvas-wrap { width: 100%; height: 100px; background: #ffffff; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
        canvas { width: 100%; height: 100%; touch-action: none; cursor: crosshair; }

        /* FOOTER ACTIONS */
        .bottom-action-bar { position: sticky; bottom: 0; background: #ffffff; padding: 14px 20px; border-top: 1px solid var(--border); box-shadow: 0 -4px 10px rgba(0,0,0,0.04); display: flex; justify-content: center; z-index: 20; }
        .btn-save-haccp { background: var(--haccp-primary); color: #fff; border: none; padding: 16px 28px; border-radius: var(--radius-lg); font-size: 1.15rem; font-weight: 700; width: 100%; max-width: 950px; cursor: pointer; box-shadow: 0 4px 6px rgba(21, 128, 61, 0.2); }
        .btn-save-haccp:active { transform: scale(0.98); }

        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 50000; }
        .toast { background: #1e293b; color: #fff; padding: 14px 24px; border-radius: 30px; font-size: 0.95rem; font-weight: 600; opacity: 0; transition: opacity 0.3s; box-shadow: var(--shadow-sm); text-align: center; }
        .toast.show { opacity: 1; }
    </style>

    <!-- FIREBASE COMPAT SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
</head>
<body>
    <div id="toast-container"></div>

    <header class="app-header">
        <div class="header-left">
            <button class="back-btn" onclick="window.location.href='tablet_hub.html'">
                ← Reparto
            </button>
            <div class="header-title">HACCP & Autocontrollo Cucina</div>
        </div>
        <div style="font-size:0.85rem; font-weight:800; color:var(--haccp-primary); background:#f0fdf4; padding:6px 14px; border-radius:20px; border:1px solid #bbf7d0;">
            Operatore OSA: <span id="lblOpName">-</span>
        </div>
    </header>

    <!-- TABS SELEZIONE MODULO HACCP -->
    <nav class="tab-bar">
        <button class="tab-btn active" id="tabBtnTemp" onclick="window.switchTab('temp')">🌡️ Temperature Frigo/Celle</button>
        <button class="tab-btn" id="tabBtnSanif" onclick="window.switchTab('sanif')">✨ Sanificazione & Pulizie</button>
        <button class="tab-btn" id="tabBtnMerci" onclick="window.switchTab('merci')">📦 Controllo Merci & Lotti</button>
    </nav>

    <main class="main-container">
        <div class="content-wrapper">

            <!-- 1. REGISTRO TEMPERATURE FRIGORIFERI -->
            <div id="secTemp" class="card-box">
                <h3 class="card-title">
                    <span>🌡️ Rilievo Temperature Impianti</span>
                    <input type="date" id="tempData" style="font-size:0.85rem; padding:4px 8px; border:1px solid var(--border); border-radius:4px; font-weight:bold; color:var(--haccp-primary);">
                </h3>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label>Frigorifero 1 - Carni / Freschi (Max +4°C)</label>
                        <input type="number" step="0.1" id="tempFrigo1" class="touch-input" placeholder="Es. +3.2">
                    </div>
                    <div class="form-group">
                        <label>Frigorifero 2 - Verdure / Latticini (Max +4°C)</label>
                        <input type="number" step="0.1" id="tempFrigo2" class="touch-input" placeholder="Es. +3.8">
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label>Congelatore / Cella Surgelati (Max -18°C)</label>
                        <input type="number" step="0.1" id="tempFreezer" class="touch-input" placeholder="Es. -20.5">
                    </div>
                    <div class="form-group">
                        <label>Fascia Oraria Rilievo</label>
                        <select id="tempFascia" class="touch-input">
                            <option value="Mattina (Inizio Turno)">Mattina (Inizio Turno)</option>
                            <option value="Pomeriggio (Fine Turno)">Pomeriggio (Fine Turno)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Eventuali Anomalie / Azioni Correttive</label>
                    <input type="text" id="tempNote" class="touch-input" placeholder="Nessuna anomalia. Impianti a regime.">
                </div>
            </div>

            <!-- 2. REGISTRO SANIFICAZIONI -->
            <div id="secSanif" class="card-box" style="display:none;">
                <h3 class="card-title">
                    <span>✨ Sanificazione & Igienizzazione Attrezzature</span>
                    <input type="date" id="sanifData" style="font-size:0.85rem; padding:4px 8px; border:1px solid var(--border); border-radius:4px; font-weight:bold; color:var(--haccp-primary);">
                </h3>

                <div class="form-group">
                    <label>Aree e Piani Sanificati</label>
                    <div class="check-grid">
                        <label class="check-item"><input type="checkbox" class="chk-sanif" value="Piani di Lavoro Inox"> Piani di Lavoro Inox</label>
                        <label class="check-item"><input type="checkbox" class="chk-sanif" value="Affettatrice & Robot"> Affettatrice & Robot</label>
                        <label class="check-item"><input type="checkbox" class="chk-sanif" value="Fornelli & Forno"> Fornelli & Forno</label>
                        <label class="check-item"><input type="checkbox" class="chk-sanif" value="Lavastoviglie & Lavelli"> Lavastoviglie & Lavelli</label>
                        <label class="check-item"><input type="checkbox" class="chk-sanif" value="Pavimenti Cucina"> Pavimenti Cucina</label>
                        <label class="check-item"><input type="checkbox" class="chk-sanif" value="Cella Frigorifera"> Cella Frigorifera</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Prodotto Igienizzante Utilizzato</label>
                    <input type="text" id="sanifProdotto" class="touch-input" value="Detergente Disinfettante Clorato / Alcolico HACCP">
                </div>
            </div>

            <!-- 3. CONTROLLO MERCI & TRACCIABILITÀ LOTTI -->
            <div id="secMerci" class="card-box" style="display:none;">
                <h3 class="card-title">
                    <span>📦 Controllo Merci in Arrivo & Lotti</span>
                    <input type="date" id="merciData" style="font-size:0.85rem; padding:4px 8px; border:1px solid var(--border); border-radius:4px; font-weight:bold; color:var(--haccp-primary);">
                </h3>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label>Fornitore / Documento di Trasporto (DDT)</label>
                        <input type="text" id="merciFornitore" class="touch-input" placeholder="Es. Fornitore Carni SpA - DDT 451">
                    </div>
                    <div class="form-group">
                        <label>Tipologia Prodotto</label>
                        <input type="text" id="merciProdotto" class="touch-input" placeholder="Es. Pollo Fresco / Latticini">
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label>Temperatura Trasporto (°C)</label>
                        <input type="number" step="0.1" id="merciTemp" class="touch-input" placeholder="Es. +3.5">
                    </div>
                    <div class="form-group">
                        <label>Stato Imballaggi & Conformità</label>
                        <select id="merciStato" class="touch-input">
                            <option value="Conforme (Integro, idoneo)">Conforme (Integro, idoneo)</option>
                            <option value="Non Conforme (Respinto)">Non Conforme (Respinto)</option>
                        </select>
                    </div>
                </div>

                <!-- Foto Etichetta / Lotto -->
                <div class="form-group">
                    <label>📸 Foto Etichetta / Lotto Prodotto (Opzionale)</label>
                    <div class="camera-box" id="cameraZone">
                        <input type="file" id="cameraInput" class="file-hidden-input" accept="image/*" capture="environment" onchange="window.handleImageCapture(event)">
                        <img id="previewImg" style="display:none;" alt="Foto Lotto">
                        <div id="cameraPrompt" style="padding:15px; color:var(--haccp-secondary); font-weight:700;">
                            📷 Tocca per fotografare l'etichetta del lotto
                        </div>
                    </div>
                </div>
            </div>

            <!-- FIRMA OPERATORE RESPONSABILE (OSA) -->
            <div class="card-box" style="border-top-color:#0f172a;">
                <h3 class="card-title">✍️ Firma Operatore di Cucina (OSA)</h3>
                <div class="sig-container">
                    <div style="display:flex; justify-content:space-between; font-size:0.8rem; font-weight:800; color:var(--text-muted);">
                        <span>Apponi la firma nel riquadro:</span>
                        <button type="button" onclick="window.clearSig()" style="background:#fee2e2; color:var(--alert-red); border:none; padding:3px 8px; border-radius:4px; font-weight:bold; cursor:pointer;">Pulisci</button>
                    </div>
                    <div class="sig-canvas-wrap">
                        <canvas id="sigCanvas"></canvas>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <div class="bottom-action-bar">
        <button class="btn-save-haccp" id="btnSalva" onclick="window.salvaModuloHACCP()">
            💾 Registra & Archivia nel Registro HACCP
        </button>
    </div>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyAc0fIlfds4Gne5m3qpH25uacK4NeR6TzM", 
            authDomain: "gestione-visite-b445b.firebaseapp.com", 
            projectId: "gestione-visite-b445b", 
            storageBucket: "gestione-visite-b445b.firebasestorage.app", 
            messagingSenderId: "720937824810", 
            appId: "1:720937824810:web:b04b60d1d66bb8f4040953" 
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const storage = firebase.storage();

        window.activeOperator = sessionStorage.getItem("activeOperator") || localStorage.getItem("activeOperator") || "Operatore";
        window.activeQualifica = (sessionStorage.getItem("activeQualifica") || localStorage.getItem("activeQualifica") || "Cuoco").trim();

        // CONTROLLO RIGOROSO DI SICUREZZA: Solo Cucina e Amministrazione
        const qual = window.activeQualifica.toLowerCase();
        const ruoliConsentiti = ['cuoco', 'cucina', 'amministrazione', 'amministratore', 'direttore', 'direttore sanitario'];
        const isConsentito = ruoliConsentiti.some(r => qual.includes(r));

        if (!isConsentito) {
            alert("⛔ Accesso riservato: il modulo HACCP è accessibile solo al personale di cucina e all'amministrazione.");
            window.location.href = 'tablet_hub.html';
        }

        document.getElementById('lblOpName').innerText = `${window.activeOperator} (${window.activeQualifica})`;

        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        document.getElementById('tempData').value = dateStr;
        document.getElementById('sanifData').value = dateStr;
        document.getElementById('merciData').value = dateStr;

        window.currentTab = 'temp';
        window.selectedBlob = null;

        window.showToast = (m) => {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = 'toast'; t.innerText = m;
            c.appendChild(t);
            setTimeout(() => t.classList.add('show'), 10);
            setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 2200);
        };

        window.switchTab = (tab) => {
            window.currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if(tab === 'temp') document.getElementById('tabBtnTemp').classList.add('active');
            if(tab === 'sanif') document.getElementById('tabBtnSanif').classList.add('active');
            if(tab === 'merci') document.getElementById('tabBtnMerci').classList.add('active');

            document.getElementById('secTemp').style.display = tab === 'temp' ? 'flex' : 'none';
            document.getElementById('secSanif').style.display = tab === 'sanif' ? 'flex' : 'none';
            document.getElementById('secMerci').style.display = tab === 'merci' ? 'flex' : 'none';
        };

        // CANVAS FIRMA
        const canvas = document.getElementById('sigCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false, hasSigned = false;

        function resizeCanvas() {
            const r = canvas.getBoundingClientRect();
            canvas.width = r.width; canvas.height = r.height;
            ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 2.2; ctx.lineCap = "round";
        }
        window.addEventListener('resize', resizeCanvas);
        setTimeout(resizeCanvas, 150);

        function getPos(e) {
            const r = canvas.getBoundingClientRect();
            const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0].clientX);
            const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0].clientY);
            return { x: clientX - r.left, y: clientY - r.top };
        }

        canvas.addEventListener('mousedown', (e) => { isDrawing = true; hasSigned = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); });
        canvas.addEventListener('mousemove', (e) => { if (!isDrawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
        window.addEventListener('mouseup', () => isDrawing = false);

        canvas.addEventListener('touchstart', (e) => { isDrawing = true; hasSigned = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); }, {passive:false});
        canvas.addEventListener('touchmove', (e) => { if (!isDrawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); }, {passive:false});
        window.addEventListener('touchend', () => isDrawing = false);

        window.clearSig = () => { ctx.clearRect(0,0,canvas.width,canvas.height); hasSigned = false; };

        // FOTO LOTTO
        window.handleImageCapture = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = new Image();
                img.onload = () => {
                    const c = document.createElement('canvas');
                    const MAX = 1200;
                    let w = img.width, h = img.height;
                    if (w > h) { if (w > MAX) { h *= MAX / w; w = MAX; } }
                    else { if (h > MAX) { w *= MAX / h; h = MAX; } }
                    c.width = w; c.height = h;
                    c.getContext('2d').drawImage(img, 0, 0, w, h);
                    c.toBlob(blob => {
                        window.selectedBlob = blob;
                        document.getElementById('previewImg').src = URL.createObjectURL(blob);
                        document.getElementById('previewImg').style.display = 'block';
                        document.getElementById('cameraPrompt').style.display = 'none';
                        window.showToast("Foto lotto pronta!");
                    }, 'image/jpeg', 0.85);
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        };

        // SALVATAGGIO CLOUD DEI REGISTRI HACCP
        window.salvaModuloHACCP = async () => {
            const timestamp = Date.now();
            const timeStr = `${new Date().toLocaleDateString('it-IT')} ore ${new Date().toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'})}`;
            const firmaDataUrl = hasSigned ? canvas.toDataURL('image/png') : null;
            const btn = document.getElementById('btnSalva');

            try {
                btn.disabled = true;
                btn.innerText = "⏳ Archiviazione in corso...";
                window.showToast("Salvataggio nel registro HACCP...");

                if (window.currentTab === 'temp') {
                    // REGISTRO TEMPERATURE
                    const f1 = document.getElementById('tempFrigo1').value;
                    const f2 = document.getElementById('tempFrigo2').value;
                    const fz = document.getElementById('tempFreezer').value;
                    const fascia = document.getElementById('tempFascia').value;
                    const note = document.getElementById('tempNote').value.trim();

                    if (!f1 && !f2 && !fz) {
                        btn.disabled = false;
                        btn.innerText = "💾 Registra & Archivia nel Registro HACCP";
                        return window.showToast("⚠️ Inserisci almeno una temperatura rilevata.");
                    }

                    await db.collection("haccp_temperature").add({
                        data: document.getElementById('tempData').value,
                        orario: timeStr,
                        fascia: fascia,
                        frigo1: f1 ? parseFloat(f1) : null,
                        frigo2: f2 ? parseFloat(f2) : null,
                        freezer: fz ? parseFloat(fz) : null,
                        note: note || 'Conforme',
                        firmaUrl: firmaDataUrl,
                        op: window.activeOperator,
                        ts: timestamp
                    });
                    window.showToast("✅ Temperature frigoriferi registrate!");

                } else if (window.currentTab === 'sanif') {
                    // REGISTRO SANIFICAZIONE
                    const aree = [];
                    document.querySelectorAll('.chk-sanif:checked').forEach(c => aree.push(c.value));
                    const prodotto = document.getElementById('sanifProdotto').value.trim();

                    if (aree.length === 0) {
                        btn.disabled = false;
                        btn.innerText = "💾 Registra & Archivia nel Registro HACCP";
                        return window.showToast("⚠️ Seleziona almeno un'area sanificata.");
                    }

                    await db.collection("haccp_sanificazioni").add({
                        data: document.getElementById('sanifData').value,
                        orario: timeStr,
                        areeTrattate: aree,
                        prodotto: prodotto,
                        firmaUrl: firmaDataUrl,
                        op: window.activeOperator,
                        ts: timestamp
                    });
                    window.showToast("✅ Sanificazione registrata con successo!");

                } else if (window.currentTab === 'merci') {
                    // CONTROLLO MERCI & LOTTI
                    const fornitore = document.getElementById('merciFornitore').value.trim();
                    const prodotto = document.getElementById('merciProdotto').value.trim();
                    const temp = document.getElementById('merciTemp').value;
                    const stato = document.getElementById('merciStato').value;

                    if (!fornitore) {
                        btn.disabled = false;
                        btn.innerText = "💾 Registra & Archivia nel Registro HACCP";
                        return window.showToast("⚠️ Inserisci il fornitore o DDT.");
                    }

                    let fotoUrl = null;
                    if (window.selectedBlob) {
                        const sRef = storage.ref().child(`haccp_lotti/${timestamp}_lotto.jpg`);
                        const uploadTask = await sRef.put(window.selectedBlob, { contentType: 'image/jpeg' });
                        fotoUrl = await uploadTask.ref.getDownloadURL();
                    }

                    await db.collection("haccp_merci").add({
                        data: document.getElementById('merciData').value,
                        orario: timeStr,
                        fornitore: fornitore,
                        prodotto: prodotto,
                        temperatura: temp ? parseFloat(temp) : null,
                        stato: stato,
                        fotoLottoUrl: fotoUrl,
                        firmaUrl: firmaDataUrl,
                        op: window.activeOperator,
                        ts: timestamp
                    });
                    window.showToast("✅ Controllo merci registrato!");
                }

                setTimeout(() => { window.location.href = 'tablet_hub.html'; }, 1000);

            } catch(e) {
                console.error("Errore HACCP:", e);
                window.showToast("❌ Errore durante il salvataggio.");
            } finally {
                btn.disabled = false;
                btn.innerText = "💾 Registra & Archivia nel Registro HACCP";
            }
        };
    </script>
</body>

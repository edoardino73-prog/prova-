<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Check-in Cutaneo & Clinico - NVS WardPad</title>

    <style>
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --brand-primary: #0f766e;
            --brand-secondary: #0284c7; 
            --success: #16a34a;
            --alert-amber: #f59e0b;
            --alert-red: #ef4444;
            --radius-md: 10px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-body); margin: 0; padding: 0; color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        .app-header { background: #ffffff; color: var(--text-main); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); box-shadow: var(--shadow-sm); z-index: 10; flex-shrink: 0; }
        .header-left { display: flex; align-items: center; gap: 14px; }
        .back-btn { background: none; border: none; font-size: 1.15rem; color: var(--brand-primary); font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 0; }
        .patient-title { font-size: 1.15rem; font-weight: 800; text-transform: uppercase; color: var(--text-main); border-left: 2px solid var(--border); padding-left: 14px; }

        .main-container { flex: 1; overflow-y: auto; padding: 20px 24px; -webkit-overflow-scrolling: touch; display: flex; justify-content: center; }
        .content-wrapper { width: 100%; max-width: 1100px; display: flex; flex-direction: column; gap: 20px; padding-bottom: 40px; }

        .checkin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 900px) { .checkin-grid { grid-template-columns: 1fr; } }

        .card-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 22px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; justify-content: space-between; }
        .card-title { margin: 0 0 16px 0; font-size: 1.05rem; font-weight: 800; color: var(--brand-primary); border-bottom: 1px solid var(--border); padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; text-transform: uppercase; letter-spacing: 0.5px; }

        /* BODY MAP WRAPPER */
        .body-map-container { display: flex; justify-content: space-around; align-items: center; background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px 10px; min-height: 380px; }
        .body-figure { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 48%; }
        .figure-label { font-size: 0.8rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

        /* BODY SVG STYLES */
        .body-svg { width: 100%; max-width: 170px; height: 320px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.04)); }
        .body-zone { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1.5; cursor: pointer; transition: all 0.2s ease; }
        .body-zone:hover { fill: #cbd5e1; }
        .body-zone.active { fill: var(--brand-secondary) !important; stroke: #0369a1; }
        .body-zone.alert-lesion { fill: #fca5a5 !important; stroke: var(--alert-red); }

        .selected-zone-badge { background: #e0f2fe; color: var(--brand-secondary); border: 1px solid #bae6fd; padding: 8px 14px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; margin-top: 14px; display: flex; justify-content: space-between; align-items: center; }

        /* FORM CONTROLS */
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 700; font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; }
        .touch-input { background: #f8fafc; border: 1.5px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px; font-size: 1rem; color: var(--text-main); outline: none; width: 100%; font-weight: 600; }
        .touch-input:focus { border-color: var(--brand-primary); background: #ffffff; }

        .chip-group { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
        .chip { background: #f1f5f9; border: 1px solid var(--border); padding: 8px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; color: var(--text-muted); cursor: pointer; user-select: none; transition: all 0.15s; }
        .chip.active { background: #f0fdfa; border-color: var(--brand-primary); color: var(--brand-primary); box-shadow: 0 0 0 1px var(--brand-primary); }

        .bottom-action-bar { position: sticky; bottom: 0; background: #ffffff; padding: 14px 24px; border-top: 1px solid var(--border); box-shadow: 0 -4px 10px rgba(0,0,0,0.04); display: flex; justify-content: center; z-index: 20; }
        .btn-save { background: var(--success); color: #fff; border: none; padding: 16px 28px; border-radius: var(--radius-lg); font-size: 1.15rem; font-weight: 700; width: 100%; max-width: 1100px; cursor: pointer; box-shadow: 0 4px 6px rgba(22, 163, 74, 0.2); }
        .btn-save:active { transform: scale(0.98); }

        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 50000; }
        .toast { background: #1e293b; color: #fff; padding: 14px 24px; border-radius: 30px; font-size: 1rem; font-weight: 500; opacity: 0; transition: opacity 0.3s; box-shadow: var(--shadow-md); text-align: center; }
        .toast.show { opacity: 1; }

        .svg-icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>

    <!-- FIREBASE COMPAT SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div id="toast-container"></div>

    <header class="app-header">
        <div class="header-left">
            <button class="back-btn" onclick="window.location.href='tablet_hub.html'">
                <svg class="svg-icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg> Reparto
            </button>
            <div class="patient-title" id="headerPatientName">Caricamento...</div>
        </div>
        <div style="font-size:0.85rem; font-weight:700; color:var(--brand-primary); background:#f0fdfa; padding:6px 14px; border-radius:20px; border:1px solid #ccfbf1;">
            Rivalutazione Point-of-Care
        </div>
    </header>

    <main class="main-container">
        <div class="content-wrapper">

            <div class="checkin-grid">

                <!-- 1. MAPPA CORPOREA VISIVA (BODY MAP) -->
                <div class="card-box">
                    <div>
                        <h3 class="card-title">
                            <span>🧍 Ispezione Cutanea Interattiva</span>
                            <small style="font-size:0.75rem; color:var(--text-muted);">Tocca una zona</small>
                        </h3>

                        <div class="body-map-container">
                            <!-- SAGOMA ANTERIORE -->
                            <div class="body-figure">
                                <span class="figure-label">Fronte</span>
                                <svg class="body-svg" viewBox="0 0 100 200">
                                    <!-- Testa -->
                                    <circle id="zone_head_front" class="body-zone" cx="50" cy="18" r="14" onclick="window.selectZone('Testa / Viso (Fronte)')"></circle>
                                    <!-- Tronco Torace / Addome -->
                                    <path id="zone_chest_front" class="body-zone" d="M34,35 L66,35 L62,95 L38,95 Z" onclick="window.selectZone('Torace & Addome')"></path>
                                    <!-- Braccio Sinistro -->
                                    <path id="zone_arm_left_front" class="body-zone" d="M30,38 L20,95 L26,97 L34,42 Z" onclick="window.selectZone('Arto Superiore Dx')"></path>
                                    <!-- Braccio Destro -->
                                    <path id="zone_arm_right_front" class="body-zone" d="M70,38 L80,95 L74,97 L66,42 Z" onclick="window.selectZone('Arto Superiore Sn')"></path>
                                    <!-- Gamba Sinistra -->
                                    <path id="zone_leg_left_front" class="body-zone" d="M38,98 L48,98 L45,175 L35,175 Z" onclick="window.selectZone('Arto Inferiore Dx')"></path>
                                    <!-- Gamba Destra -->
                                    <path id="zone_leg_right_front" class="body-zone" d="M52,98 L62,98 L65,175 L55,175 Z" onclick="window.selectZone('Arto Inferiore Sn')"></path>
                                    <!-- Piedi Anteriore -->
                                    <rect id="zone_feet_front" class="body-zone" x="33" y="177" width="34" height="12" rx="4" onclick="window.selectZone('Piedi / Dita')"></rect>
                                </svg>
                            </div>

                            <!-- SAGOMA POSTERIORE -->
                            <div class="body-figure">
                                <span class="figure-label">Retro (Decubiti)</span>
                                <svg class="body-svg" viewBox="0 0 100 200">
                                    <!-- Nuca / Collo -->
                                    <circle id="zone_head_back" class="body-zone" cx="50" cy="18" r="14" onclick="window.selectZone('Nuca & Rachide Cervicale')"></circle>
                                    <!-- Dorso Superiore -->
                                    <path id="zone_back_top" class="body-zone" d="M34,35 L66,35 L64,68 L36,68 Z" onclick="window.selectZone('Dorso & Scapole')"></path>
                                    <!-- Zona Sacro / Glutei (Critica decubito) -->
                                    <path id="zone_sacrum_back" class="body-zone" d="M36,70 L64,70 L62,96 L38,96 Z" onclick="window.selectZone('Zona Sacrale & Glutei')"></path>
                                    <!-- Braccia Posteriori -->
                                    <path id="zone_arm_left_back" class="body-zone" d="M30,38 L20,95 L26,97 L34,42 Z" onclick="window.selectZone('Gomito & Arto Sup. Dx')"></path>
                                    <path id="zone_arm_right_back" class="body-zone" d="M70,38 L80,95 L74,97 L66,42 Z" onclick="window.selectZone('Gomito & Arto Sup. Sn')"></path>
                                    <!-- Gambe Posteriori -->
                                    <path id="zone_leg_left_back" class="body-zone" d="M38,98 L48,98 L45,168 L35,168 Z" onclick="window.selectZone('Cavo Popliteo & Polpaccio Dx')"></path>
                                    <path id="zone_leg_right_back" class="body-zone" d="M52,98 L62,98 L65,168 L55,168 Z" onclick="window.selectZone('Cavo Popliteo & Polpaccio Sn')"></path>
                                    <!-- Talloni (Punto critico) -->
                                    <ellipse id="zone_heels_back" class="body-zone alert-lesion" cx="50" cy="178" rx="18" ry="7" onclick="window.selectZone('Talloni (Zona ad Alto Rischio)')"></ellipse>
                                </svg>
                            </div>
                        </div>

                        <div class="selected-zone-badge">
                            <span>Sito Selezionato:</span>
                            <strong id="labelSelectedZone">Zona Sacrale & Glutei</strong>
                        </div>
                    </div>

                    <div style="margin-top:14px;">
                        <label style="font-size:0.8rem; font-weight:700; color:var(--text-muted); text-transform:uppercase;">Stato Cutaneo Rilevato:</label>
                        <div class="chip-group">
                            <span class="chip active" onclick="window.setStatoCute('Cute Integra', this)">Cute Integra</span>
                            <span class="chip" onclick="window.setStatoCute('Iperemia / Arrossamento', this)">Iperemia</span>
                            <span class="chip" onclick="window.setStatoCute('Lesione Stadio I-II', this)">Lesione Grado I-II</span>
                            <span class="chip" onclick="window.setStatoCute('Medicazione Attiva', this)">Medicazione Attiva</span>
                        </div>
                    </div>
                </div>

                <!-- 2. CHECK-IN CLINICO & EVOLUTIVO -->
                <div class="card-box">
                    <div>
                        <h3 class="card-title">
                            <span>📋 Esito Rivalutazione Periodica</span>
                            <span style="font-size:0.75rem; color:var(--text-muted);">Trimestrale</span>
                        </h3>

                        <div class="form-group">
                            <label>Data Rivalutazione</label>
                            <input type="date" id="checkinData" class="touch-input">
                        </div>

                        <div class="form-group">
                            <label>Andamento Evolutivo Globale</label>
                            <select id="checkinEsito" class="touch-input">
                                <option value="Stabile / Condizioni Cliniche Invariate">Stabile / Condizioni Cliniche Invariate</option>
                                <option value="Miglioramento Globale">Miglioramento Globale</option>
                                <option value="Rallentamento Funzionale / Monitoraggio">Rallentamento Funzionale / Monitoraggio</option>
                                <option value="Peggioramento / Necessaria rivalutazione medica">Peggioramento / Necessaria rivalutazione medica</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Presidi Antidecubito in Uso</label>
                            <select id="checkinPresidi" class="touch-input">
                                <option value="Materasso a Pressione Alternata (Attivo)">Materasso a Pressione Alternata (Attivo)</option>
                                <option value="Materasso Viscoelastico / Statico">Materasso Viscoelastico / Statico</option>
                                <option value="Cuscino Sagomato per Carrozzina">Cuscino Sagomato per Carrozzina</option>
                                <option value="Nessun Presidio Particolare">Nessun Presidio Particolare</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Note e Provvedimenti Assistenziali al Letto</label>
                            <textarea id="checkinNote" class="touch-input" rows="4" placeholder="Annota osservazioni cliniche, idratazione cutanea, cambi posturali programmati..."></textarea>
                        </div>
                    </div>

                    <div style="background:#f1f5f9; padding:10px 14px; border-radius:var(--radius-md); font-size:0.8rem; color:var(--text-muted); display:flex; justify-content:space-between;">
                        <span>Operatore Incaricato:</span>
                        <strong id="labelOperatorBadge" style="color:var(--text-main);">-</strong>
                    </div>
                </div>

            </div>

        </div>
    </main>

    <div class="bottom-action-bar">
        <button class="btn-save" onclick="window.salvaCheckin()">💾 Registra Ispezione Cutanea & Check-in Clinico</button>
    </div>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyAc0fIlfds4Gne5m3qpH25uacK4NeR6TzM", 
            authDomain: "gestione-visite-b445b.firebaseapp.com", 
            projectId: "gestione-visite-b445b", 
            storageBucket: "gestione-visite-b445b.firebasestorage.app", 
            messagingSenderId: "720937824810", 
            appId: "1:720937824810:web:b04b60d1d66bb8f4040953" 
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        window.activeOperator = sessionStorage.getItem("activeOperator") || localStorage.getItem("activeOperator") || "Operatore";
        document.getElementById('labelOperatorBadge').innerText = window.activeOperator;

        const urlParams = new URLSearchParams(window.location.search);
        window.targetPatient = urlParams.get('ospite') || sessionStorage.getItem('globalSelectedPatient') || "";

        if(!window.targetPatient) {
            window.location.href = 'tablet_hub.html';
        } else {
            document.getElementById('headerPatientName').innerText = window.targetPatient;
            const n = new Date();
            document.getElementById('checkinData').value = `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
        }

        window.selectedZoneName = "Zona Sacrale & Glutei";
        window.selectedCuteStatus = "Cute Integra";

        window.showToast = (m) => {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = 'toast'; t.innerText = m;
            c.appendChild(t);
            setTimeout(() => t.classList.add('show'), 10);
            setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 2200);
        };

        // SELEZIONE ZONA DEL CORPO
        window.selectZone = (zoneName) => {
            window.selectedZoneName = zoneName;
            document.getElementById('labelSelectedZone').innerText = zoneName;
            
            document.querySelectorAll('.body-zone').forEach(el => el.classList.remove('active'));
            if (event && event.target) {
                event.target.classList.add('active');
            }
            window.showToast(`Selezionato: ${zoneName}`);
        };

        // STATO CUTE CHIP
        window.setStatoCute = (status, el) => {
            window.selectedCuteStatus = status;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
        };

        // SALVATAGGIO CHECK-IN INTEGRATO
        window.salvaCheckin = async () => {
            const dataVal = document.getElementById('checkinData').value;
            const esitoVal = document.getElementById('checkinEsito').value;
            const presidiVal = document.getElementById('checkinPresidi').value;
            const noteVal = document.getElementById('checkinNote').value.trim();

            const timeStr = `${new Date().toLocaleDateString('it-IT')} ore ${new Date().toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'})}`;
            
            const logNota = `Check-in Clinico ➔ Esito: ${esitoVal} | Cute: ${window.selectedZoneName} (${window.selectedCuteStatus}) | Presidi: ${presidiVal}${noteVal ? ' | Note: ' + noteVal : ''}`;

            try {
                window.showToast("⏳ Archiviazione check-in...");

                // 1. Registrazione nella cartella clinica
                const docRef = db.collection("cartelle_cliniche").doc(window.targetPatient);
                const docSnap = await docRef.get();
                let d = docSnap.exists ? docSnap.data() : {};

                if(!d.checkinIntegrazioni) d.checkinIntegrazioni = [];
                d.checkinIntegrazioni.unshift({
                    data: dataVal,
                    orario: timeStr,
                    op: window.activeOperator,
                    esito: esitoVal,
                    zonaIspezionata: window.selectedZoneName,
                    statoCute: window.selectedCuteStatus,
                    presidi: presidiVal,
                    note: noteVal
                });
                d.checkinDataUltima = dataVal;

                await docRef.set(d, { merge: true });

                // 2. Aggiunta automatica al diario clinico di reparto
                await db.collection("diario_clinico").add({
                    data: timeStr,
                    ospite: window.targetPatient,
                    tipo: 'Clinica',
                    nota: logNota,
                    op: window.activeOperator,
                    ts: Date.now()
                });

                window.showToast("✅ Check-in e ispezione cutanea registrati!");
                setTimeout(() => { window.location.href = 'tablet_hub.html'; }, 1200);

            } catch(e) {
                console.error("Errore salvataggio checkin:", e);
                window.showToast("❌ Errore durante il salvataggio.");
            }
        };
    </script>
</body>
</html>
